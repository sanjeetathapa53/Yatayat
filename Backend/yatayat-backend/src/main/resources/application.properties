spring.application.name=yatayat-backend

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=yatayat_db

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

driver.upload.directory=uploads/drivers

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

yatayat.admin.email=${ADMIN_EMAIL}
yatayat.admin.password=${ADMIN_PASSWORD}
yatayat.admin.name=Yatayat Administrator

yatayat.cors.allowed-origins=${YATAYAT_CORS_ALLOWED_ORIGINS:http://localhost:5173}
