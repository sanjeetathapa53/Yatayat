yatayat.payments.esewa.enabled=${YATAYAT_ESEWA_ENABLED:false}
yatayat.payments.esewa.product-code=${YATAYAT_ESEWA_PRODUCT_CODE:}
yatayat.payments.esewa.secret-key=${YATAYAT_ESEWA_SECRET_KEY:}
yatayat.payments.esewa.form-url=${YATAYAT_ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
yatayat.payments.esewa.status-url=${YATAYAT_ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
yatayat.payments.esewa.frontend-base-url=${YATAYAT_FRONTEND_BASE_URL:http://localhost:5173}
yatayat.wallet.topup.minimum-amount=${YATAYAT_WALLET_TOPUP_MINIMUM_AMOUNT:100.00}
yatayat.wallet.topup.maximum-amount=${YATAYAT_WALLET_TOPUP_MAXIMUM_AMOUNT:50000.00}

yatayat.payments.khalti.enabled=${YATAYAT_KHALTI_ENABLED:false}
yatayat.payments.khalti.secret-key=${YATAYAT_KHALTI_SECRET_KEY:}
yatayat.payments.khalti.initiate-url=${YATAYAT_KHALTI_INITIATE_URL:https://dev.khalti.com/api/v2/epayment/initiate/}
yatayat.payments.khalti.lookup-url=${YATAYAT_KHALTI_LOOKUP_URL:https://dev.khalti.com/api/v2/epayment/lookup/}
yatayat.payments.khalti.frontend-base-url=${YATAYAT_FRONTEND_BASE_URL:http://localhost:5173}

yatayat.tickets.qr-secret=${YATAYAT_TICKET_QR_SECRET:}
yatayat.local-fare-pass.qr-secret=${YATAYAT_LOCAL_FARE_PASS_QR_SECRET:${YATAYAT_TICKET_QR_SECRET:}}

yatayat.auth.otp.expiry=${YATAYAT_OTP_EXPIRY:5m}
yatayat.auth.otp.resend-cooldown=${YATAYAT_OTP_RESEND_COOLDOWN:60s}
yatayat.auth.otp.request-window=${YATAYAT_OTP_REQUEST_WINDOW:15m}
yatayat.auth.otp.maximum-attempts=${YATAYAT_OTP_MAXIMUM_ATTEMPTS:5}
yatayat.auth.otp.maximum-requests-per-window=${YATAYAT_OTP_MAXIMUM_REQUESTS_PER_WINDOW:5}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
# Admin live-monitoring freshness and upcoming-trip thresholds
yatayat.monitoring.live-threshold-seconds=30
yatayat.monitoring.offline-threshold-seconds=300
yatayat.monitoring.upcoming-trip-window-minutes=120
